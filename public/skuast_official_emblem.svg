<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840">
  <defs>
    <!-- Text Paths -->
    <path id="topTextArc" d="M 120,410 A 285,285 0 1,1 680,410" fill="none" />
    <path id="innerLeftScriptArc" d="M 190,390 A 215,215 0 0,1 360,205" fill="none" />
    <path id="innerRightScriptArc" d="M 440,205 A 215,215 0 0,1 610,390" fill="none" />
    <path id="bottomBannerTextArc" d="M 230,730 Q 400,775 570,730" fill="none" />

    <!-- Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="60%" stop-color="#f5ecda" />
      <stop offset="100%" stop-color="#dfd1ba" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3fa" />
      <stop offset="70%" stop-color="#cfe4f5" />
      <stop offset="100%" stop-color="#b2d4ee" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e4a36" />
      <stop offset="50%" stop-color="#803422" />
      <stop offset="100%" stop-color="#5a2012" />
    </linearGradient>
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52be56" />
      <stop offset="60%" stop-color="#3ca241" />
      <stop offset="100%" stop-color="#247829" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d54" />
      <stop offset="40%" stop-color="#f57c26" />
      <stop offset="85%" stop-color="#e25707" />
      <stop offset="100%" stop-color="#bf4300" />
    </linearGradient>
    <linearGradient id="ribbonDarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ad3700" />
      <stop offset="100%" stop-color="#691f00" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .bold-serif { font-family: 'Times New Roman', 'Georgia', serif; font-weight: 900; }
    .bold-sans { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
    .devanagari { font-family: 'Noto Sans Devanagari', 'Mangal', 'Segoe UI Historic', serif; font-weight: bold; }
    .arabic { font-family: 'Noto Naskh Arabic', 'Scheherazade', 'Traditional Arabic', serif; font-weight: bold; }
  </style>

  <!-- 1. TOP CASTLE BATTLEMENT (CRENELS / MASONRY) -->
  <g id="battlement" filter="url(#shadow)">
    <!-- Main crenellated wall background -->
    <path d="M 230,170 
             L 230,85 L 268,85 L 268,110 L 310,110 L 310,85 L 352,85 L 352,110 L 394,110 L 394,85 
             L 406,85 L 406,110 L 448,110 L 448,85 L 490,85 L 490,110 L 532,110 L 532,85 L 570,85 
             L 570,170 Z" 
          fill="url(#wallGrad)" stroke="#222222" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Stone masonry brick lines -->
    <!-- Horizontal mortar lines -->
    <line x1="235" y1="125" x2="565" y2="125" stroke="#7a6b57" stroke-width="1.8" />
    <line x1="235" y1="145" x2="565" y2="145" stroke="#7a6b57" stroke-width="1.8" />
    
    <!-- Vertical joints on merlons -->
    <line x1="250" y1="85" x2="250" y2="110" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="332" y1="85" x2="332" y2="110" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="416" y1="85" x2="416" y2="110" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="500" y1="85" x2="500" y2="110" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="550" y1="85" x2="550" y2="110" stroke="#7a6b57" stroke-width="1.5" />

    <!-- Staggered wall brick joints -->
    <line x1="280" y1="110" x2="280" y2="125" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="365" y1="110" x2="365" y2="125" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="450" y1="110" x2="450" y2="125" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="525" y1="110" x2="525" y2="125" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="255" y1="125" x2="255" y2="145" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="320" y1="125" x2="320" y2="145" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="400" y1="125" x2="400" y2="145" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="480" y1="125" x2="480" y2="145" stroke="#7a6b57" stroke-width="1.5" />
    <line x1="550" y1="125" x2="550" y2="145" stroke="#7a6b57" stroke-width="1.5" />
  </g>

  <!-- 2. MAIN CIRCULAR OUTER EMBLEM -->
  <!-- Outer circle shadow & white boundary -->
  <circle cx="400" cy="410" r="310" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.5" filter="url(#shadow)" />
  <circle cx="400" cy="410" r="303" fill="none" stroke="#222222" stroke-width="1.8" />

  <!-- Outer Text Ring Background -->
  <circle cx="400" cy="410" r="300" fill="#ffffff" />
  
  <!-- Outer University Name Text along Arc -->
  <text font-size="25.5" class="bold-sans" fill="#111111" letter-spacing="1.4">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SHER-E-KASHMIR UNIVERSITY OF AGRICULTURAL SCIENCES AND TECHNOLOGY
    </textPath>
  </text>

  <!-- Inner border ring separating text from center scene -->
  <circle cx="400" cy="410" r="236" fill="none" stroke="#222222" stroke-width="3" />
  <circle cx="400" cy="410" r="232" fill="none" stroke="#777777" stroke-width="1" />

  <!-- 3. INNER CENTRAL DISC (CLIP-PATH) -->
  <clipPath id="innerDiscClip">
    <circle cx="400" cy="410" r="230" />
  </clipPath>

  <g clip-path="url(#innerDiscClip)">
    <!-- Sky background -->
    <rect x="160" y="170" width="480" height="480" fill="url(#skyGrad)" />

    <!-- Radiant Rising Sun on the East (Right Horizon) -->
    <g id="risingSun">
      <!-- Sun Rays -->
      <g stroke="#ffffff" stroke-width="2.5" opacity="0.85">
        <line x1="490" y1="360" x2="430" y2="300" />
        <line x1="510" y1="350" x2="470" y2="280" />
        <line x1="530" y1="340" x2="520" y2="260" />
        <line x1="550" y1="330" x2="570" y2="255" />
        <line x1="570" y1="335" x2="615" y2="280" />
        <line x1="585" y1="350" x2="635" y2="320" />
      </g>
      <!-- Sun Core Disk -->
      <circle cx="530" cy="355" r="38" fill="#ffffff" stroke="#f6c23e" stroke-width="2" />
    </g>

    <!-- Himalayan / Pir Panjal Mountain Peaks (Reddish Terracotta) -->
    <path d="M 160,420 
             L 210,340 L 250,370 L 290,320 L 340,365 L 390,310 L 440,355 L 480,335 L 530,365 L 580,330 L 640,400 
             L 640,450 L 160,450 Z" 
          fill="url(#mountainGrad)" stroke="#3e130a" stroke-width="2" />
    
    <!-- Snow/Highlight ridges on mountains -->
    <path d="M 290,320 L 298,345 L 285,360 M 390,310 L 400,340 L 385,355 M 210,340 L 218,360" 
          stroke="#f7e1dc" stroke-width="1.8" fill="none" />

    <!-- Dal Lake / Jhelum River Ripples (Blue-violet and white flowing waves) -->
    <rect x="160" y="415" width="480" height="42" fill="#585c96" />
    <path d="M 160,424 Q 210,418 260,424 T 360,424 T 460,424 T 560,424 T 640,424" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 160,434 Q 210,428 260,434 T 360,434 T 460,434 T 560,434 T 640,434" fill="none" stroke="#9da2db" stroke-width="2" />
    <path d="M 160,444 Q 210,438 260,444 T 360,444 T 460,444 T 560,444 T 640,444" fill="none" stroke="#ffffff" stroke-width="2.2" />
    <path d="M 160,454 Q 210,448 260,454 T 360,454 T 460,454 T 560,454 T 640,454" fill="none" stroke="#373966" stroke-width="1.8" />

    <!-- Lush Kashmir Green Valley / Pasture Meadow -->
    <path d="M 160,456 Q 300,448 400,452 Q 500,456 640,456 L 640,640 L 160,640 Z" fill="url(#meadowGrad)" />
    
    <!-- Light meadow grass highlight lines -->
    <path d="M 180,480 Q 280,472 380,476" stroke="#8ae48e" stroke-width="1.5" fill="none" />
    <path d="M 420,478 Q 520,474 620,480" stroke="#8ae48e" stroke-width="1.5" fill="none" />

    <!-- Top Inscriptions inside Sky Arc -->
    <!-- Left Inscription: Sanskrit "भावय विमोर्ध्वभवम्" -->
    <text font-size="16" class="devanagari" fill="#151515" letter-spacing="1">
      <textPath href="#innerLeftScriptArc" startOffset="50%" text-anchor="middle">
        भावय विमोर्ध्वभवम्
      </textPath>
    </text>

    <!-- Right Inscription: Arabic/Urdu "ناظروا كَيفَ بَدَأَ الْخَلْقَ" -->
    <text font-size="16" class="arabic" fill="#151515" letter-spacing="1.2">
      <textPath href="#innerRightScriptArc" startOffset="50%" text-anchor="middle">
        ناظروا كَيفَ بَدَأَ الْخَلْقَ
      </textPath>
    </text>

    <!-- 4. VERTICAL CENTRAL MOTIF: DNA DOUBLE HELIX WITH 4 DISCS -->
    <!-- DNA Strand Curves (White ribbons with double borders) -->
    <g id="dnaHelix" filter="url(#shadow)">
      <!-- Left helix strand -->
      <path d="M 368,220 
               C 340,250 340,285 368,315 
               C 432,345 432,380 368,410 
               C 340,440 340,475 368,505 
               C 432,535 432,570 368,600" 
            fill="none" stroke="#222222" stroke-width="10" stroke-linecap="round" />
      <path d="M 368,220 
               C 340,250 340,285 368,315 
               C 432,345 432,380 368,410 
               C 340,440 340,475 368,505 
               C 432,535 432,570 368,600" 
            fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

      <!-- Right helix strand -->
      <path d="M 432,220 
               C 460,250 460,285 432,315 
               C 368,345 368,380 432,410 
               C 460,440 460,475 432,505 
               C 368,535 368,570 432,600" 
            fill="none" stroke="#222222" stroke-width="10" stroke-linecap="round" />
      <path d="M 432,220 
               C 460,250 460,285 432,315 
               C 368,345 368,380 432,410 
               C 460,440 460,475 432,505 
               C 368,535 368,570 432,600" 
            fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

      <!-- Horizontal rungs -->
      <line x1="365" y1="230" x2="435" y2="230" stroke="#ffffff" stroke-width="4" />
      <line x1="375" y1="325" x2="425" y2="325" stroke="#ffffff" stroke-width="4" />
      <line x1="375" y1="420" x2="425" y2="420" stroke="#ffffff" stroke-width="4" />
      <line x1="375" y1="515" x2="425" y2="515" stroke="#ffffff" stroke-width="4" />

      <!-- NODE 1 (TOP, y=268): SHEEP / RAM (Animal Husbandry) -->
      <g id="nodeSheep">
        <ellipse cx="400" cy="268" rx="44" ry="34" fill="#181818" stroke="#ffffff" stroke-width="3.5" />
        <!-- White Ram / Sheep Icon -->
        <g transform="translate(400, 268) scale(0.68)">
          <!-- Sheep Body -->
          <ellipse cx="0" cy="4" rx="26" ry="17" fill="#ffffff" />
          <!-- Head -->
          <circle cx="18" cy="-6" r="10" fill="#ffffff" />
          <!-- Curled Horn -->
          <path d="M 18,-11 C 26,-15 28,-7 21,-4" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" />
          <!-- Muzzle -->
          <ellipse cx="25" cy="-4" rx="4" ry="3" fill="#e8d5cf" />
          <!-- Legs -->
          <line x1="-14" y1="18" x2="-14" y2="27" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <line x1="-5" y1="18" x2="-5" y2="27" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <line x1="8" y1="18" x2="8" y2="27" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
          <line x1="17" y1="18" x2="17" y2="27" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        </g>
      </g>

      <!-- NODE 2 (UPPER MIDDLE, y=362): CHINAR / PINE TREE (Forestry) -->
      <g id="nodeTree">
        <ellipse cx="400" cy="362" rx="44" ry="34" fill="#181818" stroke="#ffffff" stroke-width="3.5" />
        <!-- Lush Green Chinar / Pine Tree -->
        <g transform="translate(400, 362) scale(0.72)">
          <!-- Tree Trunk -->
          <rect x="-3" y="5" width="6" height="18" fill="#a46843" rx="1" />
          <!-- Foliage tiers -->
          <path d="M 0,-24 L 16,-10 L 10,-10 L 22,4 L 14,4 L 25,16 L -25,16 L -14,4 L -22,4 L -10,-10 L -16,-10 Z" 
                fill="#2e7d32" stroke="#4caf50" stroke-width="1.2" />
          <path d="M 0,-24 L 12,-11 L 6,-11 L 16,1 L 9,1 L 18,12 L -18,12 L -9,1 L -16,1 L -6,-11 L -12,-11 Z" 
                fill="#43a047" />
        </g>
      </g>

      <!-- NODE 3 (LOWER MIDDLE, y=458): RED APPLE (Horticulture) -->
      <g id="nodeApple">
        <ellipse cx="400" cy="458" rx="44" ry="34" fill="#181818" stroke="#ffffff" stroke-width="3.5" />
        <!-- Red Kashmiri Apple with green leaf -->
        <g transform="translate(400, 458) scale(0.72)">
          <!-- Apple body lobes -->
          <path d="M 0,-10 
                   C 7,-18 24,-14 24,4 
                   C 24,18 10,24 0,21 
                   C -10,24 -24,18 -24,4 
                   C -24,-14 -7,-18 0,-10 Z" 
                fill="#d32f2f" stroke="#b71c1c" stroke-width="1.5" />
          <!-- Apple highlight -->
          <ellipse cx="-8" cy="-2" rx="4" ry="8" fill="#ff7961" opacity="0.6" transform="rotate(-15 -8 -2)" />
          <!-- Stem -->
          <path d="M 0,-9 C 2,-16 7,-20 9,-22" fill="none" stroke="#5d4037" stroke-width="3" stroke-linecap="round" />
          <!-- Leaf -->
          <path d="M 4,-14 C 14,-22 22,-16 20,-11 C 18,-6 10,-9 4,-14 Z" fill="#4caf50" stroke="#2e7d32" stroke-width="1" />
        </g>
      </g>

      <!-- NODE 4 (BOTTOM, y=552): GOLDEN WHEAT / PADDY EARS (Agriculture) -->
      <g id="nodeWheat">
        <ellipse cx="400" cy="552" rx="44" ry="34" fill="#181818" stroke="#ffffff" stroke-width="3.5" />
        <!-- Golden Wheat Sheaf -->
        <g transform="translate(400, 552) scale(0.7)">
          <!-- Central stalk -->
          <line x1="0" y1="-24" x2="0" y2="24" stroke="#fbc02d" stroke-width="3" />
          <!-- Left grains -->
          <ellipse cx="-7" cy="-18" rx="6" ry="3.5" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(-30 -7 -18)" />
          <ellipse cx="-8" cy="-8" rx="7" ry="4" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(-30 -8 -8)" />
          <ellipse cx="-8" cy="2" rx="7" ry="4" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(-30 -8 2)" />
          <ellipse cx="-8" cy="12" rx="6" ry="3.5" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(-30 -8 12)" />
          <!-- Right grains -->
          <ellipse cx="7" cy="-18" rx="6" ry="3.5" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(30 7 -18)" />
          <ellipse cx="8" cy="-8" rx="7" ry="4" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(30 8 -8)" />
          <ellipse cx="8" cy="2" rx="7" ry="4" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(30 8 2)" />
          <ellipse cx="8" cy="12" rx="6" ry="3.5" fill="#ffd54f" stroke="#f57f17" stroke-width="1" transform="rotate(30 8 12)" />
          <!-- Top awns (whiskers) -->
          <line x1="0" y1="-24" x2="-8" y2="-34" stroke="#f57f17" stroke-width="1.5" />
          <line x1="0" y1="-24" x2="0" y2="-36" stroke="#f57f17" stroke-width="1.5" />
          <line x1="0" y1="-24" x2="8" y2="-34" stroke="#f57f17" stroke-width="1.5" />
        </g>
      </g>
    </g>
  </g>

  <!-- 5. BOTTOM ORNAMENTAL BANNER SCROLL (ORANGE / TERRACOTTA) -->
  <g id="bottomBanner" filter="url(#shadow)">
    <!-- Rear ribbon folds / tails (shadowed) -->
    <!-- Left rear fold -->
    <path d="M 125,735 L 175,705 L 175,755 L 125,785 Z" fill="url(#ribbonDarkGrad)" stroke="#421300" stroke-width="2" />
    <path d="M 125,785 L 100,760 L 125,735 Z" fill="#691f00" stroke="#421300" stroke-width="2" />

    <!-- Right rear fold -->
    <path d="M 675,735 L 625,705 L 625,755 L 675,785 Z" fill="url(#ribbonDarkGrad)" stroke="#421300" stroke-width="2" />
    <path d="M 675,785 L 700,760 L 675,735 Z" fill="#691f00" stroke="#421300" stroke-width="2" />

    <!-- Left Wing (ESTD) -->
    <path d="M 160,695 L 245,690 L 255,750 L 160,755 Z" fill="url(#ribbonGrad)" stroke="#3b1100" stroke-width="2.5" />
    <text x="202" y="733" font-size="20" class="bold-sans" fill="#111111" text-anchor="middle">ESTD</text>

    <!-- Right Wing (1982) -->
    <path d="M 640,695 L 555,690 L 545,750 L 640,755 Z" fill="url(#ribbonGrad)" stroke="#3b1100" stroke-width="2.5" />
    <text x="598" y="733" font-size="20" class="bold-sans" fill="#111111" text-anchor="middle">1982</text>

    <!-- Center Main Scroll Banner -->
    <path d="M 230,670 
             Q 400,695 570,670 
             L 580,770 
             Q 400,805 220,770 Z" 
          fill="url(#ribbonGrad)" stroke="#3b1100" stroke-width="3" />

    <!-- Inner gold border piping on banner -->
    <path d="M 236,678 Q 400,702 564,678" stroke="#ffe082" stroke-width="2" fill="none" />
    <path d="M 226,762 Q 400,796 574,762" stroke="#ffe082" stroke-width="2" fill="none" />

    <!-- Center Upper Text: KASHMIR -->
    <text x="400" y="720" font-size="26" class="bold-serif" fill="#111111" text-anchor="middle" letter-spacing="4">
      KASHMIR
    </text>

    <!-- Center Lower Banner: Urdu Text for SKUAST -->
    <!-- "شیر کشمیر یونیورسٹی آف ایگریکلچرل سائنسز اینڈ ٹیکنالوجی" -->
    <text x="400" y="756" font-size="18.5" class="arabic" fill="#111111" text-anchor="middle" font-weight="bold">
      شیرِ کشمیر یونیورسٹی آف ایگریکلچرل سائنسز اینڈ ٹیکنالوجی
    </text>
  </g>
</svg>